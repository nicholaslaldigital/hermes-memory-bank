name: memorybank
version: 1.5.0
description: "Memory Bank - unlimited local long-term memory for Hermes as a knowledge graph: adding a new memory never fails for lack of room, relevance-gated recall, a lossless mirror of MEMORY.md/USER.md, an index of past sessions and skills, a live network view and a usage meter."
author: Hermes Memory Bank
requires_hermes: ">=0.21.5"
provides_hooks:
  - transform_tool_result
  - on_skill_lifecycle
